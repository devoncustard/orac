<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a237e"/>
      <stop offset="100%" style="stop-color:#0d47a1"/>
    </linearGradient>
    <linearGradient id="can" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f5f5f5"/>
      <stop offset="50%" style="stop-color:#e0e0e0"/>
      <stop offset="100%" style="stop-color:#bdbdbd"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="20" fill="url(#bg)"/>
  <!-- Beer can shape -->
  <rect x="44" y="20" width="40" height="88" rx="8" fill="url(#can)" stroke="#90a4ae" stroke-width="2"/>
  <!-- Can top rim -->
  <ellipse cx="64" cy="24" rx="18" ry="5" fill="#e0e0e0" stroke="#90a4ae" stroke-width="1.5"/>
  <!-- Can bottom rim -->
  <ellipse cx="64" cy="104" rx="18" ry="5" fill="#bdbdbd" stroke="#90a4ae" stroke-width="1.5"/>
  <!-- Lightning bolt (thunder) -->
  <polygon points="62,35 54,55 60,55 52,75 66,52 60,52 68,35" fill="#fdd835" stroke="#f9a825" stroke-width="1"/>
  <!-- Eyes -->
  <circle cx="54" cy="82" r="3" fill="#1a237e"/>
  <circle cx="74" cy="82" r="3" fill="#1a237e"/>
  <!-- Smile -->
  <path d="M 56 88 Q 64 96 72 88" fill="none" stroke="#1a237e" stroke-width="2" stroke-linecap="round"/>
</svg>
